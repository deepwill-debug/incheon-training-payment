<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인천상공회의소 교육 신청서</title>
    <!-- Toss Payments SDK -->
    <script src="https://js.tosspayments.com/v1/payment"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
        }

        .table-row {
            display: grid;
            grid-template-columns: 140px 1fr;
            border-bottom: 1px solid #e2e8f0;
        }

        .table-label {
            background-color: #f1f5f9;
            padding: 12px 16px;
            font-weight: 500;
            display: flex;
            align-items: center;
        }

        .table-content {
            padding: 8px 16px;
            display: flex;
            align-items: center;
        }

        .required::after {
            content: ' *';
            color: #ef4444;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const validateBusinessNo = (number) => {
            const raw = (number || '').replace(/[^0-9]/g, '');
            if (raw.length !== 10) return false;

            const checkWeights = [1, 3, 7, 1, 3, 7, 1, 3, 5];
            let sum = 0;

            for (let i = 0; i < 9; i++) {
                sum += parseInt(raw[i]) * checkWeights[i];
            }

            sum += Math.floor((parseInt(raw[8]) * 5) / 10);
            const checkDigit = (10 - (sum % 10)) % 10;
            return checkDigit === parseInt(raw[9]);
        };

        const formatBusinessNo = (value) => {
            if (!value) return '';
            const raw = value.replace(/[^0-9]/g, '').slice(0, 10);
            if (raw.length <= 3) return raw;
            if (raw.length <= 5) return `${raw.slice(0, 3)}-${raw.slice(3)}`;
            return `${raw.slice(0, 3)}-${raw.slice(3, 5)}-${raw.slice(5)}`;
        };

        const formatPhoneNo = (value) => {
            if (!value) return '';
            const raw = value.replace(/[^0-9]/g, '').slice(0, 11);
            if (!raw) return '';

            if (raw.startsWith('02')) {
                if (raw.length <= 2) return raw;
                if (raw.length <= 5) return `${raw.slice(0, 2)}-${raw.slice(2)}`;
                if (raw.length <= 9) return `${raw.slice(0, 2)}-${raw.slice(2, 5)}-${raw.slice(5)}`;
                return `${raw.slice(0, 2)}-${raw.slice(2, 6)}-${raw.slice(6)}`;
            }

            if (raw.length <= 3) return raw;
            if (raw.length <= 6) return `${raw.slice(0, 3)}-${raw.slice(3)}`;
            if (raw.length <= 10) return `${raw.slice(0, 3)}-${raw.slice(3, 6)}-${raw.slice(6)}`;
            return `${raw.slice(0, 3)}-${raw.slice(3, 7)}-${raw.slice(7)}`;
        };

        const InputField = ({ label, name, value, onChange, required, placeholder, type = "text", error, success, action }) => (
            <div className="table-row">
                <div className={`table-label ${required ? 'required' : ''}`}>{label}</div>
                <div className="table-content flex-col !items-start py-3 w-full">
                    <div className="flex w-full gap-2">
                        <input
                            type={type}
                            className={`flex-1 border rounded px-3 py-1.5 focus:outline-none focus:ring-2 transition-all ${error ? 'border-red-500 focus:ring-red-200' :
                                success ? 'border-green-500 focus:ring-green-200' :
                                    'border-gray-300 focus:ring-blue-500 focus:border-transparent'
                                }`}
                            placeholder={placeholder}
                            value={value}
                            onChange={(e) => onChange(name, e.target.value)}
                        />
                        {action}
                    </div>
                    {error && <p className="text-red-500 text-xs mt-1">{error}</p>}
                    {success && <p className="text-green-600 text-xs mt-1">{success}</p>}
                </div>
            </div>
        );

        const clientKey = '{{ clientKey }}';
        const orderId = '{{ orderId }}';
        let tossPayments;
        try {
            if (typeof TossPayments !== 'undefined') {
                tossPayments = TossPayments(clientKey);
            } else {
                console.error('TossPayments SDK not loaded');
            }
        } catch (e) {
            console.error('Failed to initialize TossPayments:', e);
        }

        const App = () => {

            const initialCourses = {{ initialCourses | tojson
        }};
        const [courses, setCourses] = useState(initialCourses);
        const [selectedCourseId, setSelectedCourseId] = useState(courses[0]?.id);
        const [companyInfo, setCompanyInfo] = useState({
            companyName: '',
            businessNo: '',
            ceoName: '',
            tel: '',
            address: '',
            isMember: true
        });

        const [participants, setParticipants] = useState([
            { id: Date.now(), name: '', dept: '', pos: '', mobile: '', email: '' }
        ]);

        const [agreed, setAgreed] = useState(false);
        const [businessNoError, setBusinessNoError] = useState('');
        const [businessNoSuccess, setBusinessNoSuccess] = useState('');

        useEffect(() => {
            fetch('/api/courses')
                .then(res => res.json())
                .then(data => {
                    if (data.success && data.courses.length > 0) {
                        setCourses(data.courses);
                        if (!data.courses.find(c => c.id === selectedCourseId)) {
                            setSelectedCourseId(data.courses[0].id);
                        }
                    }
                })
                .catch(err => console.error("Failed to fetch courses:", err));
        }, []);

        const selectedCourse = courses.find(c => c.id === selectedCourseId) || courses[0] || { memberFee: 0, nonMemberFee: 0, name: '' };
        const unitPrice = companyInfo.isMember ? selectedCourse.memberFee : selectedCourse.nonMemberFee;
        const totalPrice = (typeof unitPrice === 'number') ? unitPrice * participants.length : unitPrice;

        const handleCompanyChange = (name, value) => {
            let formattedValue = value;
            if (name === 'businessNo') {
                formattedValue = formatBusinessNo(value);
            } else if (name === 'tel') {
                formattedValue = formatPhoneNo(value);
            }

            setCompanyInfo(prev => ({ ...prev, [name]: formattedValue }));

            if (name === 'businessNo') {
                const rawDigits = formattedValue.replace(/[^0-9]/g, '');
                if (rawDigits.length === 10) {
                    if (validateBusinessNo(formattedValue)) {
                        setBusinessNoSuccess('유효한 사업자번호입니다.');
                        setBusinessNoError('');
                    } else {
                        setBusinessNoError('올바르지 않은 사업자번호 형식입니다.');
                        setBusinessNoSuccess('');
                    }
                } else if (rawDigits.length > 0 && rawDigits.length < 10) {
                    setBusinessNoError('10자리 사업자번호를 입력해주세요.');
                    setBusinessNoSuccess('');
                } else {
                    setBusinessNoError('');
                    setBusinessNoSuccess('');
                }
            }
        };

        const handleParticipantChange = (id, name, value) => {
            let formattedValue = value;
            if (name === 'mobile') {
                formattedValue = formatPhoneNo(value);
            }
            setParticipants(prev => prev.map(p => p.id === id ? { ...p, [name]: formattedValue } : p));
        };

        const addParticipant = () => {
            setParticipants(prev => [...prev, { id: Date.now(), name: '', dept: '', pos: '', mobile: '', email: '' }]);
        };

        const removeParticipant = (id) => {
            if (participants.length > 1) {
                setParticipants(prev => prev.filter(p => p.id !== id));
            }
        };

        const verifyMember = async () => {
            if (!companyInfo.businessNo || companyInfo.businessNo.length < 10) {
                alert('올바른 사업자번호를 입력해주세요.');
                return;
            }

            try {
                const response = await fetch('/api/verify-member', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ businessNo: companyInfo.businessNo })
                });

                const result = await response.json();

                if (response.status === 503 || result.code === 'VPN_ERROR') {
                    alert(result.message); // VPN Error
                    return;
                }

                if (!response.ok) {
                    throw new Error(result.message || '오류가 발생했습니다.');
                }

                if (result.success) {
                    if (result.isMember) {
                        alert('회원사 정보가 확인되었습니다.');
                        handleCompanyChange('isMember', true);
                    } else {
                        alert('회원 정보가 없습니다. 비회원사로 진행됩니다.');
                        handleCompanyChange('isMember', false);
                    }
                }

            } catch (error) {
                console.error("Verification failed:", error);
                alert("회원 확인 중 오류가 발생했습니다: " + error.message);
            }
        };

        const [isSubmitting, setIsSubmitting] = useState(false);

        const handleSubmit = async (e) => {
            e.preventDefault();
            if (!agreed) return;

            if (selectedCourse && selectedCourse.status === '마감') {
                alert('이미 마감된 교육 과정입니다. 해당 과정은 신청하실 수 없습니다.');
                return;
            }

            if (!companyInfo.companyName) {
                alert('업체명을 입력해주세요.');
                return;
            }

            if (!companyInfo.businessNo || companyInfo.businessNo.length < 10) {
                alert('사업자번호를 입력해주세요.');
                return;
            }

            if (companyInfo.businessNo && !validateBusinessNo(companyInfo.businessNo)) {
                alert('사업자번호를 확인해주세요.');
                return;
            }

            if (!participants || participants.length === 0 || !participants[0].name) {
                alert('참가자 성명을 입력해주세요.');
                return;
            }

            setIsSubmitting(true);

            try {
                // 1. Submit Application to backend (Auto member check & amount calculation)
                const response = await fetch('/api/submit-application', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        orderId: orderId,
                        courseId: selectedCourse.id,
                        courseName: selectedCourse.name,
                        companyInfo: companyInfo,
                        participants: participants
                    })
                });

                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.message || '신청 처리 중 오류가 발생했습니다.');
                }

                handleCompanyChange('isMember', result.isMember);

                const finalAmount = result.amount;
                const orderName = `[${selectedCourse.name}] (${participants.length}명)`;

                if (!tossPayments) {
                    alert('결제 모듈을 불러오지 못했습니다. 페이지를 새로고침해 주세요.');
                    setIsSubmitting(false);
                    return;
                }

                // 2. Launch Toss Payments SDK Immediately
                tossPayments.requestPayment('카드', {
                    amount: finalAmount,
                    orderId: orderId,
                    orderName: orderName,
                    customerName: participants[0]?.name || '신청자',
                    successUrl: window.location.origin + '/success',
                    failUrl: window.location.origin + '/fail',
                }).catch(error => {
                    setIsSubmitting(false);
                    if (error.code !== 'USER_CANCEL') {
                        alert(error.message || '결제 호출 중 오류가 발생했습니다.');
                    }
                });

            } catch (err) {
                alert('신청 접수 중 오류가 발생했습니다: ' + err.message);
                setIsSubmitting(false);
            }
        };

        const categories = useMemo(() => {
            const map = {};
            courses.forEach(course => {
                const catName = course.category || '사무관리분야 과정';
                if (!map[catName]) {
                    map[catName] = {
                        title: catName,
                        subtitle: course.categorySubtitle || '기업 현장에서 필요한 실무 중심 교육 지원',
                        items: []
                    };
                }
                map[catName].items.push(course);
            });
            return Object.values(map);
        }, [courses]);

        const handleSelectCourseFromTable = (courseId) => {
            setSelectedCourseId(courseId);
            const formEl = document.getElementById('application-form-section');
            if (formEl) {
                formEl.scrollIntoView({ behavior: 'smooth' });
            }
        };

        return (
            <div className="max-w-5xl mx-auto py-8 px-4">
                {/* Top Poster Schedule Header */}
                <div className="bg-white rounded-xl shadow-xl border border-slate-200 p-6 md:p-10 mb-10">
                    {/* Top Yellow Year Badge */}
                    <div className="flex flex-col items-center justify-center text-center mb-8">
                        <div className="bg-[#F2C94C] text-slate-900 px-6 py-1 rounded-full font-black text-sm mb-3 shadow-sm">
                            2026
                        </div>
                        <div className="flex items-center gap-2 mb-2">
                            <svg className="w-6 h-6 text-slate-800" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                            </svg>
                            <span className="text-xl font-bold text-slate-800 tracking-tight">인천상공회의소</span>
                        </div>
                        <h1 className="text-3xl md:text-4xl font-black text-slate-900 tracking-tight">
                            교육 과정 안내
                        </h1>
                        <p className="text-xs md:text-sm text-slate-500 mt-2 font-medium">
                            강좌의 <span className="text-amber-600 font-bold">[신청하기]</span> 버튼이나 해당 행을 클릭하시면 하단 신청서로 자동으로 선택되어 스크롤 이동합니다.
                        </p>
                    </div>

                    {/* Category Tables */}
                    {categories.map((cat, catIdx) => (
                        <div key={catIdx} className="mb-10 last:mb-6">
                            {/* Category Title & Subtitle */}
                            <div className="mb-3 pb-2 border-b-2 border-slate-200 flex flex-wrap items-baseline gap-3">
                                <h2 className="text-xl md:text-2xl font-black text-slate-900 border-l-4 border-slate-800 pl-3">
                                    {cat.title}
                                </h2>
                                <span className="text-xs md:text-sm text-slate-500 font-medium">
                                    {cat.subtitle}
                                </span>
                            </div>

                            {/* Responsive Table Wrapper */}
                            <div className="overflow-x-auto rounded-lg border border-slate-200 shadow-sm">
                                <table className="w-full text-left border-collapse min-w-[720px]">
                                    <thead>
                                        <tr className="bg-[#F2C94C] text-slate-900 text-sm font-black border-b border-amber-300">
                                            <th className="py-3 px-3 text-center w-12">번호</th>
                                            <th className="py-3 px-4 w-40">일정</th>
                                            <th className="py-3 px-4 w-60">강좌명 (강사명)</th>
                                            <th className="py-3 px-4">주요 교육내용</th>
                                            <th className="py-3 px-4 text-center w-40">수강료</th>
                                            <th className="py-3 px-4 text-center w-24">신청</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-200 text-xs md:text-sm text-slate-700 bg-white">
                                        {cat.items.map((course, idx) => {
                                            const isSelected = selectedCourseId === course.id;
                                            const isClosed = course.status === '마감';
                                            return (
                                                <tr
                                                    key={course.id}
                                                    onClick={() => handleSelectCourseFromTable(course.id)}
                                                    className={`cursor-pointer transition-colors hover:bg-amber-50/70 ${
                                                        isSelected ? 'bg-amber-50/90 font-medium' : ''
                                                    }`}
                                                >
                                                    <td className="py-4 px-3 text-center font-bold text-slate-500">{idx + 1}</td>
                                                    <td className="py-4 px-4 font-semibold text-slate-800">
                                                        <div>{course.date}</div>
                                                        {course.time && <div className="text-xs text-slate-500 font-normal">{course.time}</div>}
                                                    </td>
                                                    <td className="py-4 px-4">
                                                        <div className="font-bold text-slate-900">{course.title}</div>
                                                        {course.instructor && (
                                                            <div className="text-xs text-blue-700 font-medium mt-0.5">({course.instructor})</div>
                                                        )}
                                                    </td>
                                                    <td className="py-4 px-4 text-xs text-slate-600">
                                                        {Array.isArray(course.curriculum) && course.curriculum.length > 0 ? (
                                                            <ul className="space-y-1">
                                                                {course.curriculum.map((item, cIdx) => (
                                                                    <li key={cIdx} className="flex items-start gap-1">
                                                                        <span className="text-amber-500 font-bold">•</span>
                                                                        <span>{item}</span>
                                                                    </li>
                                                                ))}
                                                            </ul>
                                                        ) : (
                                                            <span>실무 맞춤형 핵심 교육</span>
                                                        )}
                                                    </td>
                                                    <td className="py-4 px-4 text-center text-xs">
                                                        <div className="font-bold text-blue-700">회원 {course.memberFee ? course.memberFee.toLocaleString() + '원' : '0원'}</div>
                                                        <div className="text-slate-600">비회원 {course.nonMemberFee ? course.nonMemberFee.toLocaleString() + '원' : '0원'}</div>
                                                    </td>
                                                    <td className="py-4 px-4 text-center">
                                                        <button
                                                            type="button"
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                handleSelectCourseFromTable(course.id);
                                                            }}
                                                            disabled={isClosed}
                                                            className={`px-3 py-1.5 rounded text-xs font-bold shadow-sm transition transform active:scale-95 ${
                                                                isClosed
                                                                    ? 'bg-slate-200 text-slate-500 cursor-not-allowed'
                                                                    : isSelected
                                                                    ? 'bg-slate-900 text-amber-300 ring-2 ring-amber-400'
                                                                    : 'bg-[#F2C94C] hover:bg-[#e6bb3e] text-slate-900'
                                                            }`}
                                                        >
                                                            {isClosed ? '마감' : isSelected ? '선택됨' : '신청하기'}
                                                        </button>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    ))}

                    {/* Location & Contact Info Banner */}
                    <div className="bg-slate-900 text-white rounded-lg p-4 text-center font-bold text-sm md:text-base flex flex-wrap justify-center items-center gap-4 mb-6 shadow-md">
                        <div>📍 교육장소 : <span className="text-amber-300">인천상공회의소 교육장</span></div>
                        <div className="hidden md:inline text-slate-600">|</div>
                        <div>📞 접수문의 : <span className="text-amber-300">경제진흥실 (032-810-2851)</span></div>
                    </div>

                    {/* Membership Info Box */}
                    <div className="bg-[#F2C94C]/15 border border-[#F2C94C] rounded-lg p-5 text-xs md:text-sm text-slate-800 space-y-1.5">
                        <h4 className="font-black text-slate-900 text-base mb-2 flex items-center gap-1.5">
                            <span className="text-amber-600">□</span> 인천상공회의소 회원가입 안내
                        </h4>
                        <p><span className="font-bold">○ 회원서비스 :</span> 기업애로 건의, 경영지원(통상, 특허, ESG, 인력 등), 포상추천, 교육 수강료 50% 감면, 무료 대관 등</p>
                        <p><span className="font-bold">○ 반기 회비액 :</span> 당연회원 - 반기 매출세액 × 2.25/1,000(부과율) / 임의회원 - 250,000원</p>
                        <p><span className="font-bold">○ 가입문의 :</span> 회원협력실 (<a href="tel:032-810-2822" className="text-blue-700 font-bold hover:underline">032-810-2822</a>)</p>
                    </div>
                </div>

                {/* Application Form Section Anchor */}
                <div id="application-form-section" className="bg-white shadow-xl rounded-lg overflow-hidden border border-gray-200 scroll-mt-6">
                    {/* Header */}
                    <div className="bg-slate-800 text-white p-6">
                        <h2 className="text-2xl font-bold mb-2">교육 참가 신청서</h2>
                        <p className="text-amber-300 font-medium">선택된 교육: {selectedCourse.title || selectedCourse.name}</p>
                    </div>

                    <form onSubmit={handleSubmit} className="p-6 space-y-8">
                        {/* Course Selection & Detail Info Card */}
                        <section>
                            <h2 className="text-lg font-bold border-l-4 border-blue-600 pl-3 mb-4 flex items-center">
                                <span className="mr-2 text-blue-600">00</span> 교육 과정 선택 및 상세 정보
                            </h2>
                            <div className="bg-blue-50 p-6 rounded-lg border border-blue-100 mb-6">
                                <label className="block text-sm font-bold text-gray-700 mb-2">상공회의소 교육 일정을 확인하여 신청할 과정을 선택해 주세요.</label>
                                <select
                                    className="w-full border border-gray-300 rounded-md px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white shadow-sm font-bold text-gray-800"
                                    value={selectedCourseId}
                                    onChange={(e) => setSelectedCourseId(Number(e.target.value))}
                                >
                                    {courses.map(course => {
                                        const isClosed = course.status === '마감';
                                        return (
                                            <option key={course.id} value={course.id}>
                                                [{isClosed ? '접수마감' : '접수중'}] {course.title || course.name} ({course.date})
                                            </option>
                                        );
                                    })}
                                </select>

                                {/* Selected Course Detailed Info Card */}
                                {selectedCourse && (
                                    <div className="mt-5 bg-white rounded-lg p-5 border border-slate-200 shadow-sm">
                                        <div className="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-gray-100">
                                            <h3 className="text-base font-bold text-slate-800 flex items-center">
                                                {selectedCourse.title || selectedCourse.name}
                                            </h3>
                                            <span className={`px-3 py-1 rounded-full text-xs font-bold ${
                                                selectedCourse.status === '마감' 
                                                    ? 'bg-red-100 text-red-700 border border-red-200' 
                                                    : 'bg-emerald-100 text-emerald-800 border border-emerald-300'
                                            }`}>
                                                ● {selectedCourse.status === '마감' ? '접수마감' : '접수중'}
                                            </span>
                                        </div>

                                        {/* Status Warning Banner if closed */}
                                        {selectedCourse.status === '마감' && (
                                            <div className="mt-3 p-3 bg-red-50 border border-red-200 rounded-md text-red-700 text-sm font-bold flex items-center gap-2">
                                                <svg className="w-5 h-5 flex-shrink-0 text-red-500" fill="currentColor" viewBox="0 0 20 20">
                                                    <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clipRule="evenodd" />
                                                </svg>
                                                <span>이미 마감된 교육입니다. 해당 과정은 추가 신청 및 결제가 불가능합니다.</span>
                                            </div>
                                        )}

                                        <div className="space-y-3 mt-4 text-sm text-gray-700">
                                            <div className="flex items-start gap-2">
                                                <span className="font-bold text-gray-800 min-w-[80px]">📍 일시/장소:</span>
                                                <span>
                                                    {selectedCourse.date || '일정 참조'}
                                                    {selectedCourse.time ? ` (${selectedCourse.time})` : ''} | {selectedCourse.location || '인천상공회의소 3층 교육장'}
                                                </span>
                                            </div>
                                            {selectedCourse.instructor && (
                                                <div className="flex items-start gap-2">
                                                    <span className="font-bold text-gray-800 min-w-[80px]">👨‍🏫 강사명:</span>
                                                    <span>{selectedCourse.instructor}</span>
                                                </div>
                                            )}
                                            <div className="flex items-start gap-2">
                                                <span className="font-bold text-gray-800 min-w-[80px]">💰 수강료:</span>
                                                <div className="flex flex-wrap items-center gap-2 font-semibold">
                                                    <span className="text-blue-700 bg-blue-50 px-2 py-0.5 rounded border border-blue-200">
                                                        회원사 {typeof selectedCourse.memberFee === 'number' ? selectedCourse.memberFee.toLocaleString() + '원' : selectedCourse.memberFee}
                                                    </span>
                                                    <span className="text-gray-700 bg-gray-50 px-2 py-0.5 rounded border border-gray-200">
                                                        비회원사 {typeof selectedCourse.nonMemberFee === 'number' ? selectedCourse.nonMemberFee.toLocaleString() + '원' : selectedCourse.nonMemberFee}
                                                    </span>
                                                    <span className="text-xs text-gray-500 font-normal">(신청 시 자동 판별)</span>
                                                </div>
                                            </div>
                                        </div>

                                        {(selectedCourse.detailUrl || selectedCourse.link) && (selectedCourse.detailUrl !== '#' && selectedCourse.link !== '#') && (
                                            <div className="mt-4 pt-3 border-t border-gray-100 flex items-center justify-between">
                                                <span className="font-bold text-gray-800 text-sm">🔗 상세 내용:</span>
                                                <a
                                                    href={selectedCourse.detailUrl || selectedCourse.link}
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    className="inline-flex items-center text-xs font-bold text-blue-600 hover:text-blue-800 hover:underline gap-1 bg-blue-50 px-3 py-1.5 rounded-md border border-blue-200 transition-colors"
                                                >
                                                    <span>인천상의 공식 안내문 확인하기 ↗</span>
                                                </a>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </section>

                        {/* Membership & Pricing Preview */}
                        <section className="bg-blue-50 border border-blue-100 rounded-lg p-5 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div>
                                <h3 className="text-blue-900 font-bold mb-2">회원사 여부 선택</h3>
                                <div className="flex gap-4">
                                    <label className="flex items-center cursor-pointer">
                                        <input type="radio" name="membership" checked={companyInfo.isMember}
                                            onChange={() => handleCompanyChange('isMember', true)} className="mr-2 w-4 h-4" />
                                        <span className="text-slate-700">회원사 ({typeof selectedCourse.memberFee === 'number' ? selectedCourse.memberFee.toLocaleString() + '원' : selectedCourse.memberFee})</span>
                                    </label>
                                    <label className="flex items-center cursor-pointer">
                                        <input type="radio" name="membership" checked={!companyInfo.isMember}
                                            onChange={() => handleCompanyChange('isMember', false)} className="mr-2 w-4 h-4" />
                                        <span className="text-slate-700">비회원사 ({typeof selectedCourse.nonMemberFee === 'number' ? selectedCourse.nonMemberFee.toLocaleString() + '원' : selectedCourse.nonMemberFee})</span>
                                    </label>
                                </div>
                            </div>
                            <div className="text-right">
                                <p className="text-slate-600 text-sm">총 교육 인원: {participants.length}명</p>
                                <p className="text-blue-700 text-2xl font-black">총 {typeof totalPrice === 'number' ? totalPrice.toLocaleString() + '원' : totalPrice}</p>
                            </div>
                        </section>

                        {/* Company Information */}
                        <section>
                            <h2 className="text-lg font-bold border-l-4 border-blue-600 pl-3 mb-4 flex items-center">
                                <span className="mr-2 text-blue-600">01</span> 업체 정보
                            </h2>
                            <div className="border-t-2 border-blue-600 border-b border-gray-200">
                                <InputField
                                    label="업체명" name="companyName" required
                                    value={companyInfo.companyName} onChange={handleCompanyChange}
                                    placeholder="상호명을 입력하세요"
                                />
                                <InputField
                                    label="사업자번호" name="businessNo" required
                                    value={companyInfo.businessNo} onChange={handleCompanyChange}
                                    placeholder="숫자 10자리 입력 (자동 하이픈)"
                                    error={businessNoError} success={businessNoSuccess}
                                    action={
                                        <button
                                            type="button"
                                            onClick={verifyMember}
                                            className="px-4 py-1.5 bg-slate-700 text-white rounded text-sm font-medium hover:bg-slate-800 transition-colors flex-shrink-0"
                                        >
                                            회원 조회
                                        </button>
                                    }
                                />
                                <InputField
                                    label="대표자명" name="ceoName"
                                    value={companyInfo.ceoName} onChange={handleCompanyChange}
                                    placeholder="대표자 성함"
                                />
                                <InputField
                                    label="대표 전화번호" name="tel" required
                                    value={companyInfo.tel} onChange={handleCompanyChange}
                                    placeholder="전화번호 입력 (자동 하이픈)"
                                />
                                <InputField
                                    label="사업장 주소" name="address"
                                    value={companyInfo.address} onChange={handleCompanyChange}
                                    placeholder="주소를 입력하세요"
                                />
                            </div>
                        </section>

                        {/* Participants Information */}
                        <section>
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-lg font-bold border-l-4 border-blue-600 pl-3 flex items-center">
                                    <span className="mr-2 text-blue-600">02</span> 수강 신청자 정보
                                </h2>
                                <button
                                    type="button"
                                    onClick={addParticipant}
                                    className="px-3 py-1 bg-blue-50 text-blue-600 border border-blue-200 rounded text-sm font-medium hover:bg-blue-100 transition-colors flex items-center"
                                >
                                    + 신청자 추가
                                </button>
                            </div>

                            {participants.map((p, idx) => (
                                <div key={p.id} className="mb-6 border-t-2 border-slate-700 border-b border-gray-200 bg-slate-50/50 p-2 rounded-b">
                                    <div className="flex justify-between items-center px-4 py-2 bg-slate-100 font-bold text-sm text-slate-700">
                                        <span>신청자 {idx + 1}</span>
                                        {participants.length > 1 && (
                                            <button
                                                type="button"
                                                onClick={() => removeParticipant(p.id)}
                                                className="text-red-500 hover:text-red-700 text-xs font-normal"
                                            >
                                                삭제
                                            </button>
                                        )}
                                    </div>
                                    <InputField
                                        label="성명" name="name" required
                                        value={p.name} onChange={(n, v) => handleParticipantChange(p.id, n, v)}
                                        placeholder="수강자 성명"
                                    />
                                    <InputField
                                        label="부서 / 직위" name="dept"
                                        value={p.dept} onChange={(n, v) => handleParticipantChange(p.id, n, v)}
                                        placeholder="예: 경영지원팀 / 대리"
                                    />
                                    <InputField
                                        label="휴대폰 번호" name="mobile" required
                                        value={p.mobile} onChange={(n, v) => handleParticipantChange(p.id, n, v)}
                                        placeholder="010-0000-0000"
                                    />
                                    <InputField
                                        label="이메일" name="email" required type="email"
                                        value={p.email} onChange={(n, v) => handleParticipantChange(p.id, n, v)}
                                        placeholder="example@company.com"
                                    />
                                </div>
                            ))}
                        </section>

                        {/* Privacy Policy */}
                        <section className="bg-gray-50 p-5 rounded-lg border border-gray-200">
                            <h3 className="font-bold text-gray-800 mb-2">개인정보 수집 및 이용 동의</h3>
                            <div className="text-xs text-gray-600 bg-white p-3 border border-gray-200 rounded max-h-32 overflow-y-auto mb-3">
                                1. 수집 항목: 업체명, 사업자번호, 대표자명, 전화번호, 주소, 수강자 성명, 부서, 직위, 휴대폰, 이메일<br />
                                2. 수집 목적: 교육 신청 접수, 안내 발송, 수료증 발급 및 회계 처리<br />
                                3. 보유 기간: 교육 완료 후 관련 법령에 따른 보관 기간까지
                            </div>
                            <div className="flex items-center justify-end">
                                <label className="inline-flex items-center cursor-pointer">
                                    <input
                                        type="checkbox"
                                        className="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
                                        checked={agreed}
                                        onChange={(e) => setAgreed(e.target.checked)}
                                    />
                                    <span className="ml-2 text-gray-700 font-medium font-bold">위 안내사항에 동의합니다. (필수)</span>
                                </label>
                            </div>
                        </section>

                        {/* Submit Button */}
                        <div className="pt-6 border-t border-gray-100 flex flex-col items-center">
                            {!agreed && <p className="text-red-500 text-sm mb-3">개인정보 수집 및 이용에 동의하셔야 신청이 가능합니다.</p>}
                            {selectedCourse && selectedCourse.status === '마감' && (
                                <p className="text-red-600 font-bold text-sm mb-3">⚠️ 현재 선택된 과정은 마감되어 신청이 불가능합니다.</p>
                            )}
                            <button
                                type="submit"
                                disabled={!agreed || isSubmitting || (selectedCourse && selectedCourse.status === '마감')}
                                className={`px-10 py-3 rounded-md text-lg font-bold shadow-lg transform transition flex items-center ${
                                    agreed && !isSubmitting && selectedCourse && selectedCourse.status !== '마감' 
                                        ? 'bg-blue-600 hover:bg-blue-700 text-white active:scale-95' 
                                        : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                                }`}
                            >
                                {isSubmitting ? (
                                    <>
                                        <svg className="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                        </svg>
                                        회원 확인 및 결제 준비 중...
                                    </>
                                ) : selectedCourse && selectedCourse.status === '마감' ? (
                                    <>접수 마감된 교육입니다</>
                                ) : (
                                    <>
                                        결제하기
                                        <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 ml-2" viewBox="0 0 20 20" fill="currentColor">
                                            <path fillRule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clipRule="evenodd" />
                                        </svg>
                                    </>
                                )}
                            </button>
                        </div>
                    </form>

                    {/* Footer Info */}
                    <div className="bg-gray-50 p-6 border-t border-gray-200 text-xs text-gray-500">
                        <p className="font-bold mb-1">인천상공회의소 (Education Service Center)</p>
                        <p>인천광역시 남동구 은봉로 60번길 46 | Tel: 032-810-2800 | Fax: 032-810-2806</p>
                    </div>
                </div>
            </div>
        );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
